<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContextFlow Translate</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-body">
  <header class="top">
    <div class="brand-row"><div class="brand-logo">CF</div><div><h1>ContextFlow</h1><div class="version" data-i18n="popupSubtitle">High-fidelity bilingual translator</div></div></div>
    <p data-i18n="popupIntro">Translate with context, terminology, and an AI model you control.</p>
  </header>
  <main class="panel">
    <div class="field language-field"><label for="uiLanguage" data-i18n="language">Interface language</label><select id="uiLanguage"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="es">Español</option></select></div>
    <div class="card">
      <div class="eyebrow" data-i18n="activeModel">Active AI model</div>
      <div class="value" id="model" data-i18n="loading">Loading…</div>
      <div class="muted" id="detail">Connection settings</div>
    </div>
    <div class="actions">
      <button type="button" class="button primary" id="start" data-i18n="start">Translate page</button>
      <button type="button" class="button" id="copy-discussion" data-i18n="copy">Copy discussion</button>
      <div class="two">
        <button type="button" class="button" id="stop" data-i18n="stop">Stop</button>
        <button type="button" class="button danger" id="clear" data-i18n="clear">Remove translations</button>
      </div>
      <button type="button" class="button" id="settings" data-i18n="settings">Settings</button>
    </div>
    <div id="message" class="message" role="status" data-i18n="popupHint">Page content is not sent until you click Translate.</div>
    <div class="footer"><span class="muted" data-i18n="original">Original text stays intact.</span><a href="https://developer.chrome.com/docs/extensions/" target="_blank" rel="noreferrer" data-i18n="docs">Chrome extensions</a></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
